# Optional: nginx in front of the bridge, e.g. to serve it on port 80, or
# over HTTPS once you add your certificate (browsers only grant the screen
# Wake Lock to HTTPS pages, or to localhost).
# Not needed otherwise: the bridge serves the page, /now and /art itself.
server {
    listen 80;

    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header Host $host;
    }
}
