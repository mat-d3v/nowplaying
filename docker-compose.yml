services:
  nowplaying:
    image: python:3.12-slim
    container_name: nowplaying
    # Host network: the bridge reaches mpd on 127.0.0.1 like a local
    # install, and listens on the host's port 8766 (or PORT from .env)
    network_mode: host
    working_dir: /app
    # The whole folder: the page, its assets and .env are read from here
    volumes:
      - ./:/app:ro
    command: python mpd-bridge.py
    restart: unless-stopped
