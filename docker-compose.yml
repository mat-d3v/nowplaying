services:
  nowplaying:
    image: python:3.12-slim
    container_name: nowplaying
    # Host network: the bridge reaches mpd on 127.0.0.1 like a local
    # install, and listens on the host's port 8766 (or PORT from .env)
    network_mode: host
    working_dir: /app
    # The whole folder: the page, its assets and .env are read from here
    volumes:
      - ./:/app:ro
      # AirPlay: shairport-sync's metadata pipe (see the README)
      # - /tmp/shairport-sync-metadata:/tmp/shairport-sync-metadata
    command: python mpd-bridge.py
    # Python as PID 1 ignores the stop signal: without an init process,
    # every stop or restart waited 10 s before Docker killed it
    init: true
    restart: unless-stopped
