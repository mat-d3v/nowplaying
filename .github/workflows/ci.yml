name: CI

on:
  push:
  pull_request:

jobs:
  bridge:
    name: Bridge tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bridge tests (against a fake mpd, no dependencies)
        run: python3 -m unittest discover -s tests -v
      - name: Lint install.sh
        run: shellcheck install.sh
      - name: Check docker-compose.yml
        run: docker compose config --quiet

  page:
    name: Page tests in Chromium
    # Playwright 1.56 installs Chromium's system libraries for Ubuntu 24.04:
    # stay on it while ubuntu-latest moves on to Ubuntu 26 (October 2026)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Page tests
        run: node tests/ui_test.js

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t nowplaying .
      - name: Run it (demo mode), check what it serves and saves
        run: |
          docker run -d --name nowplaying -e DEMO=1 -p 8766:8766 nowplaying
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8766/now >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8766/now | python3 -c "import json, sys; assert json.load(sys.stdin)['source'] == 'demo'"
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"clock": "12"}' http://127.0.0.1:8766/display
          docker exec nowplaying python3 mpd-bridge.py --check
