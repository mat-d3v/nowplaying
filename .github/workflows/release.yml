name: Release

# Pushing a version tag publishes a GitHub release, with that version's
# section of CHANGELOG.md as its notes:
#   (bump VERSION in mpd-bridge.py, add the CHANGELOG.md section)
#   git tag -a v1.0.0 -m "nowplaying 1.0.0" && git push origin v1.0.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches the bridge's version
        run: |
          version="$(python3 mpd-bridge.py --version | cut -d' ' -f2)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME but VERSION is $version"; exit 1; }
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No section for ${GITHUB_REF_NAME#v} in CHANGELOG.md"; exit 1; }
      - name: Publish the release
        run: gh release create "$GITHUB_REF_NAME" --title "nowplaying $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
